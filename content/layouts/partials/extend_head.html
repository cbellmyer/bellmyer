<!-- Remove favicon -->
<link rel="icon" href="data:,">
<link rel="shortcut icon" href="data:,">
<link rel="apple-touch-icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Social share image (Open Graph + Twitter/X) -->
<meta property="og:image" content="{{ "og-image.png" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Chris Bellmyer — Wastewater Reclamation, GIS, Maryland 5A Licensed">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
<meta name="twitter:description" content="{{- with .Description }}{{ . }}{{- else }}{{- if or .IsPage .IsSection }}{{ .Summary | default site.Params.description }}{{- else }}{{ site.Params.description }}{{- end }}{{- end -}}">
<meta name="twitter:image" content="{{ "og-image.png" | absURL }}">
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('{{ "sw.js" | relURL }}', { scope: '{{ "/" | relURL }}' }).catch(function (err) {
                console.warn('Service Worker registration failed:', err);
            });
        });
    }
</script>
