{{- if not (.Param "hideFooter") }}
<footer class="footer">
    <span>
        {{- if site.Copyright }}{{ site.Copyright | markdownify }}{{- else }}&copy; {{ now.Year }} <a href="/">{{ site.Title }}</a>{{- end }}
    </span>
    <span class="footer-tagline">The tools change. The water doesn't.</span>
    <span class="footer-links">
        <a href="mailto:chris.bellmyer@proton.me">Email</a>
        <a href="https://github.com/cbellmyer" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://linkedin.com/in/cbellmyer" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </span>
</footer>
{{- end }}

{{- if (not site.Params.disableScrollToTop) }}
<a href="#top" aria-label="go to top" title="Go to Top (Alt + G)" class="top-link" id="top-link" accesskey="g">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 6" fill="currentColor">
        <path d="M12 6H0l6-6z" />
    </svg>
</a>
{{- end }}
