# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://bellmyer.com/"
title: "Chris Bellmyer"
copyright: "CC BY-NC 4.0"
theme: [hypercat-theme]

enableInlineShortcodes: true
buildDrafts: false
buildFuture: true
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "experience"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

disableKinds:
  - taxonomy
  - term

menu:
  main:
    - name: Home
      url: /
      weight: 10

outputs:
  home:
    - HTML
    - JSON
  page:
    - HTML
  section:
    - HTML

params:
  env: production
  defaultTheme: dark
  disableThemeToggle: true
  description: "Chris Bellmyer"
  author: "Chris Bellmyer"
  # author: ["Me", "You"] # multiple authors

  # disableSpecial1stPost: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # images: ["images/hyper.png"]

  profileMode:
    enabled: true
    title: "Chris Bellmyer"
    subtitle: "Wastewater Reclamation Plant Operator III"
    imageUrl: "images/profile/chris.jpg"
    imageTitle: "Chris Bellmyer"
    imageWidth: 400
    imageHeight: 400
    buttons:
      - name: View Experience Log
        url: /experience/

  socialIcons:
    - name: github
      title: Follow on GitHub
      url: "https://github.com/bellmyer"
    - name: linkedin
      title: Connect on LinkedIn
      url: "https://linkedin.com/in/bellmyer"

  # label:
  # iconSVG: '<svg xmlns="http://www.w3.org/2000/svg" height="25"
  #   viewBox="0 -960 960 960" fill="currentColor"><path
  #   d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33
  #   0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5
  #   56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>'
  # text: "Home"
  # icon: icon.png
  # iconHeight: 35

  # analytics:
  #   google:
  #     SiteVerificationTag: "XYZabc"

  assets:
    disableHLJS: true
    # favicon: "<link / abs url>"
    # favicon16x16: "<link / abs url>"
    # favicon32x32: "<link / abs url>"
    # apple_touch_icon: "<link / abs url>"
    # safari_pinned_tab: "<link / abs url>"

  cover:
    hidden: false  # hide everywhere but not in structured data
    hiddenInList: true  # hide on list pages and home
    hiddenInSingle: false  # hide on single page
    relative: true
    linkFullImages: true
    responsiveImages: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
